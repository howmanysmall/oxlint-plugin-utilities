name: ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "src/**/*.ts"
      - "tests/**/*.ts"
      - "scripts/**/*.ts"
      - ".github/actions/**/*.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.lock"
      - "mise.toml"
      - "knip.ts"
      - "tsconfig*.json"
      - "tsdown.config.ts"
      - "vitest.config.ts"
      - ".oxlintrc.json"
      - "biome.jsonc"
  pull_request:
    paths:
      - "src/**/*.ts"
      - "tests/**/*.ts"
      - "scripts/**/*.ts"
      - ".github/actions/**/*.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.lock"
      - "mise.toml"
      - "knip.ts"
      - "tsconfig*.json"
      - "tsdown.config.ts"
      - "vitest.config.ts"
      - ".oxlintrc.json"
      - "biome.jsonc"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup

      - name: Validate package
        uses: ./.github/actions/validate-package
        with:
          check-biome: "true"
          check-knip: "true"
          lint-command: node --run oxc

      - name: Tests
        run: node --run test
