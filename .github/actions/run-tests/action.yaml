name: Run Tests
description: Optionally restore dist artifacts and run tests

inputs:
  artifact-name:
    description: Build artifact name
    required: false
    default: dist
  download-artifact:
    description: Download dist before running tests
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Download build artifacts
      if: inputs.download-artifact == 'true'
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/

    - name: Run tests
      shell: bash
      run: aube run test
