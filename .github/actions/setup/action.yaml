name: Setup Build Environment
description: Setup mise, pnpm, and dependency caches

inputs:
  cache-version:
    description: Cache namespace version
    required: false
    default: v1
  mise-version:
    description: mise version to install
    required: false
    default: v2026.6.14

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      with:
        cache: false
        install: true
        install_args: node pnpm bun ni nub hk
        version: ${{ inputs.mise-version }}

    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      id: pnpm-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml',
          'pnpm-workspace.yaml', 'mise.lock', 'mise.toml', 'package.json') }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Save pnpm store
      if: steps.pnpm-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
