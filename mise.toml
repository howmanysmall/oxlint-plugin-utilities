[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]
HK_MISE = 1

[settings]
auto_install = false
experimental = true
github_attestations = true
lockfile = true

[tools]
"cargo:similarity-ts" = "latest"
"github:howmanysmall/npm-registry-mcp" = "latest"
"github:howmanysmall/pullhook" = "latest"
"npm:sherif" = "latest"
actionlint = "latest"
betterleaks = "latest"
bun = "1.3.14"
hk = "latest"
ni = "latest"
node = "26"
npm = "latest"
nub = "latest"
pinact = "latest"
pkl = "latest"
pnpm = "11.15.0"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
vale = "latest"
zizmor = "latest"
