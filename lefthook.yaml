commit-msg:
  jobs:
    - name: commitlint
      run: aube run commitlint --edit {1}

min_version: 2.1.4

post-merge:
  jobs:
    - name: package-install
      run: pullhook --install

pre-commit:
  jobs:
    - glob:
        - "*.css"
        - "*.html"
        - "*.json"
        - "*.jsonc"
        - "*.grit"
        - "*.code-workspace"
      name: biome-json
      run: aube run biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - glob:
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
      name: js-ts-fix
      run: |
        aube run oxc --fix {staged_files}
        aube run biome check --write --no-errors-on-unmatched {staged_files}
        aube run format {staged_files}
      stage_fixed: true

    - glob:
        - "*.json5"
        - "*.mdx"
      name: format-json5-mdx
      run: aube run format {staged_files}
      stage_fixed: true

    - glob: "*.md"
      name: md-fix
      run: |
        rumdl check --fix {staged_files}
        rumdl fmt {staged_files}
      stage_fixed: true

    - glob: "*.toml"
      name: toml-fix
      run: |
        tombi lint {staged_files}
        tombi format {staged_files}
      stage_fixed: true

    - glob:
        - "*.yaml"
        - "*.yml"
      name: yaml-format
      run: aube run format {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: build
      run: |
        if echo {push_files} | grep -qE '\.(ts|tsx|js|jsx|json|jsonc|toml)$'; then
          aube run build
        fi

    - name: biome-ci
      run: |
        if echo {push_files} | grep -qE '\.(css|html|json|jsonc|grit|code-workspace|js|jsx|ts|tsx)$'; then
          aube run biome ci
        fi

    - name: oxc
      run: |
        if echo {push_files} | grep -qE '\.(js|jsx|ts|tsx)$'; then
          aube run build:oxc --minify
          aube run oxc .
        fi

    - name: type-check
      run: |
        if echo {push_files} | grep -qE '\.(ts|tsx|js|jsx|json|jsonc)$'; then
          aube run type-check
        fi

    - name: knip
      run: |
        if echo {push_files} | grep -qE '\.(ts|tsx|js|jsx|json|jsonc|toml)$'; then
          aube run knip
        fi

    - name: test
      run: |
        if echo {push_files} | grep -qE '\.(ts|tsx|js|jsx|json|jsonc|toml)$'; then
          aube run vitest run
        fi
